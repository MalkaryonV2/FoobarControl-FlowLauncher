name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches plugin.json
        run: |
          v=$(python -c "import json;print(json.load(open('plugin.json'))['Version'])")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != plugin.json version v$v"; exit 1; }
      - name: Compile check
        run: python -m py_compile main.py
      - name: Build zip
        run: python scripts/build_zip.py
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
